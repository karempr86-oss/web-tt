<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول - SecureCrypt</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}.hero-gradient{background: radial-gradient(circle at 50% 30%, #2e1065 0%, #0f0826 70%, #090514 100%)}</style>
</head>
<body class="bg-[#090514] text-white min-h-screen flex items-center justify-center p-4 hero-gradient">

<div class="w-full max-w-md bg-[#130c2e] border border-purple-900/40 rounded-[24px] p-6 sm:p-8 shadow-2xl">
<div class="text-center mb-6"><div class="w-14 h-14 mx-auto rounded-xl bg-purple-600 flex items-center justify-center text-2xl"><i class="fa-solid fa-shield-halved"></i></div><h1 class="text-2xl font-black mt-3">Secure<span class="text-purple-400">Crypt</span></h1><p class="text-xs text-purple-200/60 mt-1">لازم تسجل دخول الأول</p></div>

<div class="flex bg-[#0c0721] p-1 rounded-xl text-xs font-bold mb-6"><button id="t1" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-lg bg-purple-600 text-white">دخول</button><button id="t2" onclick="switchTab('reg')" class="flex-1 py-2.5 rounded-lg text-purple-300">حساب جديد</button></div>

<div id="loginForm" class="space-y-4">
<input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3.5 text-sm text-white outline-none focus:border-purple-500">
<input id="loginPass" type="password" placeholder="كلمة المرور" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3.5 text-sm text-white outline-none focus:border-purple-500">
<button onclick="doLogin()" id="loginBtn" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold text-sm">تسجيل الدخول</button>
<button onclick="loginWithGoogle()" class="w-full py-3.5 border border-purple-900/40 rounded-xl text-sm font-bold flex justify-center gap-2"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5"> دخول بجوجل</button>
</div>

<div id="regForm" class="space-y-4 hidden">
<input id="regName" type="text" placeholder="اسمك" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3.5 text-sm text-white">
<input id="regEmail" type="email" placeholder="البريد" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3.5 text-sm text-white">
<input id="regPass" type="password" placeholder="كلمة المرور (6 حروف على الأقل)" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3.5 text-sm text-white">
<button onclick="doRegister()" id="regBtn" class="w-full py-3.5 bg-purple-600 rounded-xl font-bold text-sm">إنشاء حساب</button>
</div>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#130c2e] border border-purple-500/50 text-white px-6 py-3 rounded-xl hidden z-50 text-xs"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyBn56UKJbcNtb0mal-ki4H1G-MLvMmk-dw", authDomain: "web-tsh.firebaseapp.com", projectId: "web-tsh", storageBucket: "web-tsh.firebasestorage.app", messagingSenderId: "902436935435", appId: "1:902436935435:web:322c5d7584cbae1190340e", measurementId: "G-KDE2Y0131P" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, (user)=>{ if(user) location.href='app.html'; });

window.switchTab=(t)=>{document.getElementById('loginForm').classList.toggle('hidden',t!=='login');document.getElementById('regForm').classList.toggle('hidden',t!=='reg');document.getElementById('t1').className=t=='login'?'flex-1 py-2.5 rounded-lg bg-purple-600 text-white':'flex-1 py-2.5 rounded-lg text-purple-300';document.getElementById('t2').className=t=='reg'?'flex-1 py-2.5 rounded-lg bg-purple-600 text-white':'flex-1 py-2.5 rounded-lg text-purple-300';}
window.showToast=(m)=>{const t=document.getElementById('toast');t.innerText=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000);}
window.doLogin=async()=>{const e=document.getElementById('loginEmail').value,p=document.getElementById('loginPass').value;if(!e||!p)return showToast('اكمل البيانات');document.getElementById('loginBtn').innerText='جاري الدخول...';try{await signInWithEmailAndPassword(auth,e,p);showToast('تم الدخول');}catch(err){showToast('خطأ: '+err.message);}document.getElementById('loginBtn').innerText='تسجيل الدخول';}
window.doRegister=async()=>{const n=document.getElementById('regName').value,e=document.getElementById('regEmail').value,p=document.getElementById('regPass').value;if(!n||!e||!p)return showToast('اكمل البيانات');document.getElementById('regBtn').innerText='جاري الإنشاء...';try{const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});showToast('تم إنشاء الحساب - سجل دخول');switchTab('login');}catch(err){showToast(err.message);}document.getElementById('regBtn').innerText='إنشاء حساب';}
window.loginWithGoogle=async()=>{try{await signInWithPopup(auth,provider);}catch(e){showToast(e.message);}}
</script>
</body>
</html>
