<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - SecureCrypt</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}.hero-gradient{background: radial-gradient(circle at 50% 30%, #2e1065 0%, #0f0826 70%, #090514 100%)}</style>
</head>
<body class="bg-[#090514] text-white min-h-screen flex flex-col">

<header class="bg-[#0c0721] border-b border-purple-900/40 h-20 flex items-center sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
<a href="index.html" class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center"><i class="fa-solid fa-shield-halved"></i></div><span class="text-2xl font-black">Secure<span class="text-purple-400">Crypt</span></span></a>
<a href="index.html" class="text-sm text-gray-300">← الرئيسية</a>
</div>
</header>

<div class="flex-1 flex items-center justify-center px-4 py-12 hero-gradient">
<div class="w-full max-w-5xl grid lg:grid-cols-2 gap-0 bg-[#130c2e] border border-purple-900/40 rounded-[24px] overflow-hidden shadow-[0_0_60px_rgba(124,58,237,0.2)]">
<div class="p-10 bg-gradient-to-br from-[#1a1033] to-[#0f0826] hidden lg:flex flex-col justify-between border-l border-purple-900/30">
<div><div class="w-16 h-16 rounded-2xl bg-purple-600 flex items-center justify-center text-3xl">🔒</div><h2 class="text-3xl font-black mt-8">مرحبا بك في<br><span class="text-purple-400">SecureCrypt</span></h2><p class="text-purple-200/60 text-sm mt-4">مشروع web-tsh - تسجيل دخول آمن بـ Firebase</p></div>
<div class="text-[11px] text-purple-300/40">Firebase Project: web-tsh 🔥</div>
</div>
<div class="p-8 sm:p-10 bg-[#130c2e]">
<div class="flex bg-[#0c0721] p-1.5 rounded-xl text-sm font-bold mb-8"><button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-lg bg-purple-600 text-white">تسجيل الدخول</button><button id="tabReg" onclick="switchTab('register')" class="flex-1 py-2.5 rounded-lg text-purple-300">إنشاء حساب</button></div>
<div id="loginForm" class="space-y-5"><input id="loginEmail" type="email" placeholder="البريد" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3 text-sm text-white"><input id="loginPass" type="password" placeholder="كلمة المرور" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3 text-sm text-white"><button onclick="doLogin()" class="w-full py-3 bg-purple-600 text-white font-bold rounded-xl">دخول</button><button onclick="loginWithGoogle()" class="w-full py-3 border border-purple-900/40 rounded-xl text-sm font-bold flex items-center justify-center gap-2"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5"> دخول بجوجل</button></div>
<div id="registerForm" class="space-y-5 hidden"><input id="regName" type="text" placeholder="الاسم" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3 text-sm text-white"><input id="regEmail" type="email" placeholder="البريد" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3 text-sm text-white"><input id="regPass" type="password" placeholder="كلمة المرور" class="w-full bg-[#090514] border border-purple-900/50 rounded-xl p-3 text-sm text-white"><button onclick="doRegister()" class="w-full py-3 bg-purple-600 text-white font-bold rounded-xl">إنشاء حساب</button></div>
</div>
</div>
</div>
<div id="toast" class="fixed bottom-5 right-5 bg-[#130c2e] border border-purple-500/50 text-white px-5 py-3 rounded-xl hidden z-50"><span id="toastMsg" class="text-xs"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBn56UKJbcNtb0mal-ki4H1G-MLvMmk-dw",
  authDomain: "web-tsh.firebaseapp.com",
  projectId: "web-tsh",
  storageBucket: "web-tsh.firebasestorage.app",
  messagingSenderId: "902436935435",
  appId: "1:902436935435:web:322c5d7584cbae1190340e",
  measurementId: "G-KDE2Y0131P"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.switchTab = (t)=>{document.getElementById('loginForm').classList.toggle('hidden',t!=='login');document.getElementById('registerForm').classList.toggle('hidden',t!=='register');}
window.showToast=(m,err=false)=>{const t=document.getElementById('toast');document.getElementById('toastMsg').innerText=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000);}
window.doLogin=async()=>{try{await signInWithEmailAndPassword(auth,loginEmail.value,loginPass.value);showToast('تم الدخول!');setTimeout(()=>location.href='index.html',1000);}catch(e){showToast(e.message,true);}}
window.doRegister=async()=>{try{const c=await createUserWithEmailAndPassword(auth,regEmail.value,regPass.value);await updateProfile(c.user,{displayName:regName.value});showToast('تم إنشاء الحساب!');switchTab('login');}catch(e){showToast(e.message,true);}}
window.loginWithGoogle=async()=>{try{await signInWithPopup(auth,provider);showToast('تم بجوجل!');setTimeout(()=>location.href='index.html',1000);}catch(e){showToast(e.message,true);}}
</script>
</body>
</html>
